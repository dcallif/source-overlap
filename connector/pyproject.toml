[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source-overlap-connect"
version = "0.1.0"
description = "Local LM Studio connector for Source Overlap"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "websockets>=12",
]

[project.scripts]
source-overlap-connect = "source_overlap_connector.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["source_overlap_connector*"]
