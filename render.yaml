services:
  - type: web
    name: source-overlap
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: "auto"
      - key: REQUIRE_CONNECTOR
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CACHE_DIR
        value: /tmp/source-overlap-cache
